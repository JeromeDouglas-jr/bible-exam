<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Bible Exam Prep · RTS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>:root{
  --bg:#FAFAFA; --card:#FFFFFF; --ink:#262626; --muted:#737373; --line:#DBDBDB; --soft:#EFEFEF;
  --accent:#0095F6; --accent-ink:#FFFFFF; --bad:#ED4956; --good:#2E7D32; --warn:#B76E00;
  --grad:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#121212; --ink:#F5F5F5; --muted:#A8A8A8; --line:#363636; --soft:#262626;
  --accent:#1DA1F7; --accent-ink:#FFFFFF; --bad:#FF6B76; --good:#5BD16B; --warn:#F2B13C; color-scheme: dark; } }
:root[data-theme="dark"]{ --bg:#000000; --card:#121212; --ink:#F5F5F5; --muted:#A8A8A8; --line:#363636; --soft:#262626;
  --accent:#1DA1F7; --accent-ink:#FFFFFF; --bad:#FF6B76; --good:#5BD16B; --warn:#F2B13C; color-scheme: dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--card); }
button,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
a{ color:var(--accent); }

header.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--card); border-bottom:1px solid var(--line); }
.top-in{ max-width:935px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:10px 16px; }
.brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:-.2px; background:none; border:0; cursor:pointer; padding:0; }
.brand .ring{ width:34px; height:34px; border-radius:50%; background:var(--grad); padding:2px; }
.brand .ring span{ display:grid; place-items:center; width:100%; height:100%; border-radius:50%; background:var(--card); font-size:15px; }
nav.tabs{ display:flex; gap:2px; margin-left:auto; }
nav.tabs button{ background:none; border:0; padding:8px 11px; border-radius:8px; cursor:pointer; color:var(--muted); font-weight:600; font-size:14px; }
nav.tabs button[aria-current="page"]{ color:var(--ink); background:var(--soft); }
.iconbtn{ background:none; border:1px solid var(--line); border-radius:8px; padding:6px 9px; cursor:pointer; }
nav.bottom{ display:none; }
@media (max-width:760px){
  nav.tabs{ display:none; }
  nav.bottom{ display:flex; position:fixed; bottom:0; left:0; right:0; z-index:6; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav.bottom button{ flex:1; background:none; border:0; padding:8px 2px 9px; font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  nav.bottom button span.i{ font-size:19px; line-height:1; }
  nav.bottom button[aria-current="page"]{ color:var(--ink); font-weight:700; }
  main{ padding-bottom:80px !important; }
  .brand .wordmark small{ display:none; }
}
main{ max-width:935px; margin:0 auto; padding:20px 16px 48px; }
h1{ font-size:24px; line-height:1.25; margin:0 0 6px; letter-spacing:-.3px; }
h2{ font-size:18px; margin:0 0 10px; letter-spacing:-.2px; }
h3{ font-size:15px; margin:0 0 6px; }
p{ margin:0 0 10px; }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
.lead{ font-size:16px; max-width:62ch; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
.card.flat{ background:transparent; }
.row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
@media (max-width:760px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.btn{ border:0; border-radius:8px; padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer; background:var(--accent); color:var(--accent-ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.ghost{ background:var(--soft); color:var(--ink); }
.btn.line{ background:transparent; border:1px solid var(--line); color:var(--ink); }
.btn.grad{ background:var(--grad); color:#fff; }
.btn.sm{ padding:6px 11px; font-size:13px; }
.pill{ display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--soft); color:var(--ink); }
.pill.bad{ background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); }
.pill.good{ background:color-mix(in srgb,var(--good) 16%,transparent); color:var(--good); }
.pill.warn{ background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn); }
.pill.acc{ background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); }

/* stories row — the lesson sequence */
.stories{ display:flex; gap:18px; overflow-x:auto; padding:4px 2px 8px; }
.story{ background:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:72px; padding:0; }
.story .o{ width:70px; height:70px; border-radius:50%; padding:3px; background:var(--grad); }
.story.done .o{ background:var(--line); }
.story.locked .o{ background:repeating-conic-gradient(var(--line) 0 8deg, transparent 8deg 16deg); }
.story .in{ width:100%; height:100%; border-radius:50%; background:var(--card); border:3px solid var(--card); display:grid; place-items:center; font-weight:800; font-size:22px; }
.story.done .in{ color:var(--muted); }
.story small{ font-size:12px; color:var(--ink); max-width:80px; text-align:center; line-height:1.25; }
.story.locked small{ color:var(--muted); }

.stat{ display:flex; flex-direction:column; gap:2px; }
.stat b{ font-size:26px; letter-spacing:-.5px; line-height:1.1; }
.bar{ height:8px; background:var(--soft); border-radius:99px; overflow:hidden; position:relative; }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.bar.grad > i{ background:var(--grad); }
.bar .mark{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
.split{ display:flex; height:12px; border-radius:99px; overflow:hidden; }
.split .w{ background:var(--grad); } .split .s{ background:var(--good); }
table.t{ width:100%; border-collapse:collapse; font-size:14px; }
table.t th,table.t td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
table.t th{ font-size:12px; color:var(--muted); font-weight:600; }
.tablewrap{ overflow-x:auto; }

/* questions */
.q{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
.q .num{ font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
.q .stem{ font-size:16px; font-weight:600; margin-bottom:12px; }
.opts{ display:grid; gap:8px; }
.opt{ display:flex; gap:12px; align-items:center; text-align:left; width:100%; min-height:48px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:15px; }
.opt .k{ flex:none; width:28px; height:28px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--muted); }
.opt[aria-pressed="true"]{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.opt[aria-pressed="true"] .k{ background:var(--accent); border-color:var(--accent); color:#fff; }
.opt.right{ border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
.opt.wrong{ border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad); }
.conf{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
.conf button{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; }
.conf button[aria-pressed="true"]{ background:var(--ink); color:var(--card); border-color:var(--ink); }
.conf .need{ font-size:12px; color:var(--warn); font-weight:600; }
.qgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(30px,1fr)); gap:4px; }
.qgrid button{ height:30px; border-radius:6px; border:1px solid var(--line); background:var(--card); font-size:11px; cursor:pointer; padding:0; }
.qgrid button.a{ background:color-mix(in srgb,var(--accent) 18%,var(--card)); border-color:transparent; }
.qgrid button.p{ background:color-mix(in srgb,var(--warn) 22%,var(--card)); }
.qgrid button.cur{ outline:2px solid var(--ink); }
.sticky-foot{ position:sticky; bottom:0; background:var(--bg); padding:10px 0; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; z-index:2; }
@media (max-width:760px){ .sticky-foot{ bottom:58px; } }

.expl{ font-size:14px; border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
.expl .src{ font-size:12px; color:var(--muted); }
.supp{ font-size:12px; color:var(--muted); font-style:italic; }
.flag{ border-left:3px solid var(--warn); padding:6px 10px; background:color-mix(in srgb,var(--warn) 9%,transparent); border-radius:0 8px 8px 0; font-size:13px; margin:8px 0; }

/* learn */
.stage{ display:flex; gap:6px; margin:10px 0 16px; flex-wrap:wrap; }
.stage span{ font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--soft); color:var(--muted); }
.stage span.on{ background:var(--ink); color:var(--card); }
.stage span.ok{ color:var(--good); }
.lesson h2{ font-size:20px; }
.big-answer{ font-size:22px; font-weight:700; letter-spacing:-.3px; margin:6px 0 12px; }
.controls{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.panel{ background:var(--soft); border-radius:10px; padding:12px 14px; margin-top:12px; font-size:14px; }
.seqline{ display:flex; flex-wrap:wrap; gap:6px; }
.seqline span{ padding:4px 10px; border-radius:999px; border:1px solid var(--line); font-size:13px; }
.seqline span.hl{ background:var(--ink); color:var(--card); border-color:var(--ink); }

/* flashcards */
.flash{ perspective:1200px; margin:6px auto 14px; max-width:560px; }
.flash .face{ min-height:210px; border-radius:16px; border:1px solid var(--line); background:var(--card); padding:22px; display:flex; flex-direction:column; justify-content:center; gap:8px; text-align:center; }
.flash.back .face{ background:linear-gradient(var(--card),var(--card)) padding-box, var(--grad) border-box; border:2px solid transparent; }
.flash .face .big{ font-size:20px; font-weight:700; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 12px; cursor:pointer; font-size:14px; text-align:left; }
.chip.sel{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.chip.done{ opacity:.45; cursor:default; border-style:dashed; }
.chip.shake{ animation:shake .35s; border-color:var(--bad); }
@keyframes shake{ 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.match{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* score ring */
.ring-score{ --p:0; width:120px; height:120px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--soft) 0); display:grid; place-items:center; flex:none; }
.ring-score > div{ width:96px; height:96px; border-radius:50%; background:var(--card); display:grid; place-items:center; text-align:center; }
.ring-score b{ font-size:26px; display:block; line-height:1; }

/* celebration */
.celebrate{ position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden; }
.celebrate .target{ position:absolute; left:50%; top:16%; transform:translateX(-50%); }
.celebrate .ball{ position:absolute; font-size:44px; animation-duration:1.1s; animation-timing-function:cubic-bezier(.3,.6,.4,1); animation-fill-mode:forwards; }
.celebrate.big .ball{ font-size:64px; }
.celebrate .label{ position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.4); font-weight:900; font-size:40px; letter-spacing:-1px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop 1.3s .45s forwards; opacity:0; white-space:nowrap; filter:drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
.celebrate.big .label{ font-size:52px; }
@keyframes pop{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.4)} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.12)} 75%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-60%) scale(1)} }
.hoop{ width:76px; height:14px; border:5px solid #FF7A00; border-radius:50%; position:relative; }
.hoop::after{ content:""; position:absolute; left:6px; right:6px; top:8px; height:34px; background:repeating-linear-gradient(60deg,transparent 0 6px,rgba(140,140,140,.7) 6px 7px),repeating-linear-gradient(-60deg,transparent 0 6px,rgba(140,140,140,.7) 6px 7px); clip-path:polygon(0 0,100% 0,80% 100%,20% 100%); }
.netline{ width:180px; height:46px; border-top:4px solid var(--ink); background:repeating-linear-gradient(90deg,transparent 0 8px,var(--line) 8px 9px); opacity:.85; }
.goal{ width:150px; height:76px; border:5px solid var(--ink); border-bottom:none; background:repeating-linear-gradient(45deg,transparent 0 7px,var(--line) 7px 8px),repeating-linear-gradient(-45deg,transparent 0 7px,var(--line) 7px 8px); }
.uprights{ width:110px; height:90px; border-left:6px solid #F2B13C; border-right:6px solid #F2B13C; border-bottom:6px solid #F2B13C; position:relative; }
.uprights::after{ content:""; position:absolute; left:50%; top:100%; width:6px; height:40px; background:#F2B13C; transform:translateX(-50%); }
.endzone{ width:220px; height:60px; background:repeating-linear-gradient(90deg,#2E7D32 0 22px,#3E9442 22px 44px); border-radius:6px; display:grid; place-items:center; color:#fff; font-weight:900; letter-spacing:3px; }
.pocket{ width:52px; height:52px; border-radius:50%; background:#111; box-shadow:0 0 0 9px #6B3E1F; }
.emoji-target{ font-size:56px; }
@keyframes arc{ 0%{left:12%;top:78%;transform:scale(.7) rotate(0)} 55%{left:46%;top:6%;transform:scale(1.1) rotate(220deg)} 100%{left:calc(50% - 22px);top:17%;transform:scale(.55) rotate(330deg);opacity:0} }
@keyframes longarc{ 0%{left:2%;top:86%;transform:scale(.6)} 50%{left:38%;top:0%;transform:scale(1.15) rotate(260deg)} 100%{left:calc(50% - 22px);top:17%;transform:scale(.5) rotate(380deg);opacity:0} }
@keyframes drop{ 0%{left:calc(50% - 22px);top:-10%;transform:scale(1.2)} 70%{left:calc(50% - 22px);top:16%;transform:scale(1)} 100%{left:calc(50% - 22px);top:30%;transform:scale(.6);opacity:0} }
@keyframes line{ 0%{left:-8%;top:62%;transform:scale(.8) rotate(0)} 100%{left:calc(50% - 22px);top:19%;transform:scale(.7) rotate(540deg);opacity:.2} }
@keyframes zig{ 0%{left:6%;top:70%} 25%{left:30%;top:30%} 50%{left:22%;top:55%} 75%{left:44%;top:22%} 100%{left:calc(50% - 22px);top:18%;opacity:.2} }
@keyframes spike{ 0%{left:20%;top:0%;transform:scale(1.2)} 100%{left:calc(50% - 22px);top:30%;transform:scale(.8) rotate(400deg);opacity:.2} }
@keyframes roll{ 0%{left:-8%;top:24%;transform:rotate(0)} 100%{left:calc(50% - 22px);top:19%;transform:rotate(720deg);opacity:.3} }
@keyframes homer{ 0%{left:45%;top:85%;transform:scale(.6)} 100%{left:85%;top:-12%;transform:scale(1.3) rotate(720deg);opacity:0} }
.confetti{ position:absolute; width:8px; height:12px; top:-20px; border-radius:2px; animation:fall 1.6s ease-in forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); } }
canvas#fw{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:49; }
.victory{ text-align:center; border:2px solid var(--good); }
@media (prefers-reduced-motion: reduce){ .celebrate .ball,.confetti{ animation-duration:.01s !important; } .celebrate .label{ animation-duration:1.4s; } }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--card); padding:9px 16px; border-radius:999px; font-size:13px; z-index:60; }
@media (max-width:760px){ .toast{ bottom:84px; } }
.drop{ border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; }
details summary{ cursor:pointer; font-weight:600; }
.kbd{ font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 5px; color:var(--muted); }
</style></head>

 T1:{name:"Genesis 1–11: creation to Babel", sec:"PENT",

 T2:{name:"Genesis patriarchs: key chapters", sec:"PENT",

 T3:{name:"Genesis families", sec:"PENT",

 {id:"f024",e:24,b:"Exodus",s:"PENT",t:"T4",k:"loc",q:"Where is the burning bush?",a:"Exodus 3",d:["Exodus 2","Exodus 6","Exodus 14","Exodus 19"],r:[["Exodus",3,4]],ev:"Moses at the burning bush",dn:{"Exodus 14":"Exodus 14 is crossing the Red Sea.","Exodus 19":"Exodus 19 is arrival at Sinai."},n:"God reveals His name, “I AM WHO I AM” (3:14).",m:"3 = “I AM” — three words in “I AM WHO.”"},

function celebrate(big){

  const el = document.createElement("div"); el.className = "celebrate" + (big ? " big" : "");
  el.innerHTML = `<div class="target">${s.target}</div><div class="ball" style="animation-name:${s.path}">${s.ball}</div><div class="label">${big ? "🏆 " : ""}${s.label}</div>`;
  if (big) for (let i = 0; i < 40; i++) { const c = document.createElement("i"); c.className = "confetti"; c.style.left = Math.random() * 100 + "%"; c.style.background = ["#F58529","#DD2A7B","#8134AF","#515BD4","#0095F6","#FFD600"][i % 6]; c.style.animationDelay = Math.random() * .5 + "s"; el.appendChild(c); }
  document.body.appendChild(el); setTimeout(() => el.remove(), big ? 2200 : 1700);
}
function fireworks(ms = 4200){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { celebrate(true); return; }
  const c = document.createElement("canvas"); c.id = "fw"; document.body.appendChild(c);
  const x = c.getContext && c.getContext("2d"); if (!x) { c.remove(); celebrate(true); return; } const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const parts = []; const cols = ["#F58529","#DD2A7B","#8134AF","#515BD4","#0095F6","#FFD600","#5BD16B"];
  const burst = () => { const cx = W * (.15 + Math.random() * .7), cy = H * (.12 + Math.random() * .4), col = cols[Math.floor(Math.random() * cols.length)]; for (let i = 0; i < 70; i++) { const a = Math.random() * Math.PI * 2, v = (1.5 + Math.random() * 4) * devicePixelRatio; parts.push({x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, col}); } };
  const t0 = performance.now(); let last = 0;
  (function f(t){ if (t - last > 380 && t - t0 < ms - 900) { burst(); last = t; } x.globalCompositeOperation = "destination-out"; x.fillStyle = "rgba(0,0,0,.22)"; x.fillRect(0, 0, W, H); x.globalCompositeOperation = "lighter";
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .05 * devicePixelRatio; p.l -= .012; if (p.l > 0) { x.fillStyle = p.col; x.globalAlpha = p.l; x.fillRect(p.x, p.y, 3 * devicePixelRatio, 3 * devicePixelRatio); } }
    x.globalAlpha = 1; if (t - t0 < ms) requestAnimationFrame(f); else c.remove(); })(t0);
}

async function handlePdf(file){
  const st = $("#pdfstatus"); st.textContent = "Reading PDF…";
  try {
    if (!window.pdfjsLib) throw new Error("PDF reader didn't load. Check your connection, or use the set that's already processed.");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    let text = ""; const pages = [];
    for (let p = 1; p <= doc.numPages; p++) { const tc = await (await doc.getPage(p)).getTextContent(); const t = tc.items.map(i => i.str).join(" "); pages.push(t); text += " " + t; }
    const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
    const N = norm(text);
    const matched = RAW.filter(r => N.includes(norm(r[2]).slice(0, 28))).map(r => r[0]);
    const stated = (text.match(/Terms \((\d+)\)/) || [])[1];
    S.imported = {at: Date.now(), file: file.name, pages: doc.numPages, matched, stated: stated ? +stated : null, builtIn: false};

}

function newAttempt(kind, qs, extra = {}){ return Object.assign({kind, qs, resp: qs.map(() => ({})), page: 0, per: 10, done: false, startedAt: Date.now()}, extra); }
function runner(att, path, title){

    </article>`;
  }).join("");

  return `<h1>${esc(title)}</h1>
   <p class="small muted">Pick an answer, then say how sure you were. Answers stay hidden until you submit. <span class="kbd">A–D</span> picks, <span class="kbd">K</span> <span class="kbd">E</span> <span class="kbd">G</span> rates confidence.</p>

     ${p < pages - 1 ? `<button class="btn" data-a="page" data-p="${path}" data-d="1">Next ${per}</button>` : `<button class="btn grad" data-a="submit" data-p="${path}" ${answered < att.qs.length ? "disabled" : ""}>Submit ${att.qs.length} answers</button>${answered < att.qs.length ? `<span class="small muted">${att.qs.length - answered} still need an answer and a confidence rating</span>` : ""}`}

}
function submit(path){
  const att = attAt(path); if (!att || att.done) return;
  const src = SRC_OF[path.includes(".") ? (path.startsWith("rev") ? "rev" : path.split(".")[1]) : path];
  att.qs.forEach((q, i) => E.record(S, q, att.resp[i].c, att.resp[i].k, src));
  att.done = true; att.finishedAt = Date.now();
  const an = E.analyzeAttempt(att); att.summary = {correct: an.correct, total: an.total, pct: an.pct, ca: an.caMastery};
  S.history.push({at: Date.now(), kind: path.split(".").pop().replace(/^L\d$/, ""), path, day: path[0] === "L" ? +path[1] : null, ...att.summary});
  save();
  if (path === "final" && an.pct >= 0.8) { setTimeout(() => fireworks(), 150); }
  else if (an.pct >= 0.8) celebrate(true);
  else if (an.correct > 0) celebrate(false);
}

// ---------- review (spaced repetition + evening mode)
function reviewView(){
  if (!S.diag || !S.diag.done) return `<div class="card"><h1>Review</h1><p>Review fills up after your diagnostic.</p></div>`;
  const R = S.rev;
  if (R && !R.done) {
    if (R.stage === "learn") { const id = R.ids[R.i], f = F(id);
      return `<p class="small muted">Evening review · learn ${R.i + 1} of ${R.ids.length}</p><div class="card lesson"><p style="font-size:16px">${esc(f.ev || f.q)}</p><div class="big-answer">${esc(f.a)}</div><p>${esc(f.n || "")}</p>${f.m ? `<div class="panel">💡 ${esc(f.m)}</div>` : ""}<div class="controls"><button class="btn" data-a="revNext">${R.i === R.ids.length - 1 ? "Quiz me" : "Next"}</button></div></div>`; }
    if (!R.quiz.done) return runner(R.quiz, "rev.quiz", R.title);
    return `<div class="card"><h2>${R.quiz.summary.correct}/${R.quiz.summary.total}</h2><button class="btn" data-a="revDone">Back to review</button></div>${resultList(R.quiz, "rev.quiz", false)}`;
  }
  const due = E.dueReview(S, 50); const c = E.counts(S);
  const weakest = FACTS.filter(f => E.factStats(S, f.id).status === "weak").sort((a, b) => E.severity(S, b.id) - E.severity(S, a.id)).slice(0, 8);
  return `<h1>Review</h1><p class="lead muted">Spaced repetition: facts you miss come back tomorrow; facts you know confidently come back after 2, 4, 7, then 14 days.</p>
  <div class="grid3"><div class="card stat"><span class="small muted">Due now</span><b>${due.length}</b></div><div class="card stat"><span class="small muted">Weak</span><b>${c.weak}</b></div><div class="card stat"><span class="small muted">Mastered</span><b>${c.mastered}</b></div></div>
  <div class="grid2"><div class="card"><h2>15-minute evening review</h2><p class="small">Six of your weakest due facts: a quick teach, then a 6-question check. No full exam.</p><button class="btn grad" data-a="startRev" data-k="evening" ${due.length + c.weak ? "" : "disabled"}>Start evening review</button></div>
  <div class="card"><h2>Targeted drills</h2><p class="small">Ten questions in new wording.</p><div class="row"><button class="btn line sm" data-a="startRev" data-k="weak">Weakest areas</button><button class="btn line sm" data-a="startRev" data-k="canon">Book order</button></div></div></div>
  <div class="card"><h3>Coming up</h3>${weakest.length ? `<table class="t"><tbody>${weakest.map(f => { const s = E.factStats(S, f.id); return `<tr><td>${esc(f.ev || f.q)}</td><td><b>${esc(f.a)}</b></td><td class="small">${s.misconception ? '<span class="pill bad">Misconception</span>' : `<span class="pill">${pct(s.mastery)}</span>`}</td></tr>`; }).join("")}</tbody></table>` : "<p class='small'>Nothing weak right now.</p>"}</div>`;
}
function startRev(kind){
  const seed = Date.now() % 1e9, r = E.rng(seed);
  let ids = E.dueReview(S, 6); if (ids.length < 6) ids = [...new Set(ids.concat(FACTS.filter(f => E.factStats(S, f.id).status === "weak").sort((a, b) => E.severity(S, b.id) - E.severity(S, a.id)).map(f => f.id)))].slice(0, 6);
  if (kind === "evening") { const qs = ids.map(id => { const f = F(id), fm = E.formsFor(f); return E.buildQ(f, fm[fm.length - 1], r); }); S.rev = {kind, ids, i: 0, stage: "learn", quiz: newAttempt("rev", qs), title: "Evening review check"}; }
  if (kind === "weak") { const pool = FACTS.filter(f => E.factStats(S, f.id).status !== "mastered").sort((a, b) => E.severity(S, b.id) - E.severity(S, a.id)).slice(0, 10); const qs = pool.map(f => { const fm = E.formsFor(f); return E.buildQ(f, fm[Math.floor(r() * fm.length)], r); }); S.rev = {kind, stage: "quiz", quiz: newAttempt("rev", qs), title: "Weakest areas drill"}; }
  if (kind === "canon") { const all = [...CANON.OT, ...CANON.NT].map(g => g[0]); S.rev = {kind, stage: "quiz", quiz: newAttempt("rev", E.canonQuestions(all, 10, r)), title: "Book order drill"}; }
  save(); render();
}

// ---------- progress

  const tbl = (o, label) => `<div class="tablewrap"><table class="t"><thead><tr><th>${label}</th><th>Accuracy</th><th>Mastery</th><th>Answers</th><th>Weak facts</th></tr></thead><tbody>${Object.entries(o).sort((a, b) => (a[1].mastery == null ? 2 : a[1].mastery) - (b[1].mastery == null ? 2 : b[1].mastery)).map(([k, v]) => `<tr><td>${esc(KINDS[k] || k)}</td><td>${v.acc == null ? '<span class="pill">Unassessed</span>' : pct(v.acc)}</td><td style="min-width:110px">${v.mastery == null ? "—" : `<div class="bar"><i style="width:${v.mastery * 100}%"></i></div>`}</td><td class="small muted">${v.n}</td><td>${v.weak || ""}</td></tr>`).join("")}</tbody></table></div>`;
  const hist = S.history.slice(-14);
  return `<h1>Progress</h1>
  <div class="grid2"><div class="card"><h3>By testament</h3>${tbl(byTest, "Testament")}</div><div class="card"><h3>By kind of knowledge</h3>${tbl(byKind, "Kind")}</div></div>
  <div class="card"><h3>Recent scores</h3>${hist.length ? `<div class="row" style="align-items:flex-end;gap:6px;height:120px">${hist.map(h => `<div title="${esc(h.kind)} ${h.correct}/${h.total}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="small">${Math.round(h.pct * 100)}</span><div style="width:100%;max-width:34px;height:${h.pct * 90}px;border-radius:6px 6px 2px 2px;background:${h.pct >= .8 ? "var(--good)" : "var(--accent)"}"></div><span class="small muted">${h.kind === "diag" ? "Diag" : h.kind === "final" ? "Final" : h.day ? "L" + h.day : "Rev"}</span></div>`).join("")}</div><p class="small muted">Green bars are at or above 80%.</p>` : ""}</div>

  <div class="card"><h3>By book</h3>${tbl(byBook, "Book")}</div>

}

  const l = cd <= 5 ? S.lessons[cd] || {} : null; const stName = l && l.stage ? (STAGES(cd).find(s => s[0] === l.stage) || ["", l.stage.startsWith("relearn") ? "Relearn" : l.stage === "retake" ? "Retake" : ""])[1] : "Not started";

  const weakT = tl.slice().sort((a, b) => a[1].mastery - b[1].mastery).slice(0, 4), strongT = tl.slice().sort((a, b) => b[1].mastery - a[1].mastery).slice(0, 3);

  return `<div class="card"><div class="stories" role="list" aria-label="Lessons">${stories}</div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><div><p class="small muted" style="margin:0">${cd <= 5 ? `Lesson ${cd} · ${stName}` : "All five lessons done"}</p><h2 style="margin:2px 0 4px">${cd <= 5 ? DAY_TITLES[cd] : "Exam readiness"}</h2>
    <p class="small muted" style="margin:0">${cd <= 5 ? `Why: ${planFor(cd).focus.length} facts here are weak or untested for you.` : "See how far you've come."}</p></div>
    <button class="btn grad" data-a="${cd <= 5 ? "openLesson" : "go"}" data-d="${cd}" data-v="finalResults">${cd <= 5 ? (l && l.stage ? "Continue" : "Start") : "Open report"}</button></div></div>
  <div class="grid3">
    <div class="card stat"><span class="small muted">Diagnostic</span><b>${an.correct}/100</b><div class="bar" style="margin-top:6px"><i style="width:${an.correct}%"></i><span class="mark" style="left:80%"></span></div><span class="small muted">Pass line 80 · adjusted ${pct(an.caMastery)}</span></div>

      <p class="small muted">Mastery is confidence-adjusted.</p></div>
  </div>
  <div class="grid3">
    <div class="card stat"><span class="small muted">Old / New Testament mastery</span><b>${pct(test.OT && test.OT.mastery)} · ${pct(test.NT && test.NT.mastery)}</b></div>
    <div class="card stat"><span class="small muted">Book order mastery</span><b>${pct(canon.mastery)}</b><span class="small muted">${canon.assessed || 0} of 66 books answered</span></div>
    <div class="card stat"><span class="small muted">Review due</span><b>${due}</b><button class="btn line sm" style="margin-top:6px;align-self:flex-start" data-a="go" data-v="review">Open review</button></div>
  </div>
  ${lastQ.length ? `<div class="card"><h3>Recent quizzes</h3><div class="row">${lastQ.map(h => `<span class="pill ${h.pct >= .8 ? "good" : ""}">${h.kind === "final" ? "Final" : h.day ? `Lesson ${h.day} ${h.kind}` : "Review"}: ${h.correct}/${h.total}</span>`).join("")}</div></div>` : ""}
  <p class="small muted"><span id="sync"></span> · <button class="btn line sm" data-a="go" data-v="import">Source cards</button> <button class="btn line sm" data-a="reset">Start over</button></p>`;
}

// ---------- events
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a, ds = b.dataset;
  const d = +ds.d;
  switch (a) {
    case "go": UI.day = null; UI.showAll = false; go(ds.v); break;
    case "theme": { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; S.theme = r.dataset.theme; save(); render(); break; }
    case "useBuiltIn": S.imported = {at: Date.now(), builtIn: true, matched: RAW.map(r => r[0]), pages: 19}; save(); go("import"); break;
    case "ifilter": UI.importFilter = ds.k; render(); break;
    case "startDiag": S.diag = newAttempt("diag", E.diagnostic(Date.now() % 1e9)); save(); render(); break;
    case "pick": { const att = attAt(ds.p); if (att.done) break; att.resp[+ds.i].c = +ds.k; save(); render(); focusQ(+ds.i); break; }
    case "conf": { const att = attAt(ds.p); if (att.done) break; att.resp[+ds.i].k = ds.k; save(); render(); focusQ(+ds.i + 1, true); break; }
    case "page": { const att = attAt(ds.p); att.page = Math.max(0, att.page + +ds.d); save(); render(); window.scrollTo({top: 0}); break; }
    case "jump": { const att = attAt(ds.p); att.page = Math.floor(+ds.i / att.per); save(); render(); focusQ(+ds.i); break; }
    case "submit": submit(ds.p); if (ds.p === "diag") UI.view = "diagResults"; render(); window.scrollTo({top: 0}); break;
    case "openres": UI.resultOpen[ds.k] = 1; render(); break;
    case "toggleAll": UI.showAll = !UI.showAll; render(); break;
    case "openLesson": if (!unlocked(d) && !(S.lessons[d] && S.lessons[d].stage)) { toast(S.diag && S.diag.done ? `Finish lesson ${d - 1} first` : "Take the diagnostic first"); break; } UI.day = d; go("lesson"); break;
    case "beginLesson": startLesson(d); UI.day = d; render(); break;
    case "recapRead": L(UI.day).recapRead = true; save(); render(); break;
    case "toStage": { const l = L(d); if (ds.s === "retake") { l.retake = newAttempt("retake", relearnQuiz(l)); } l.stage = ds.s; UI.panel = null; UI.flip = false; save(); UI.day = d; render(); window.scrollTo({top: 0}); break; }
    case "learnNext": { const l = L(d); const n = modulesFor(l).length; UI.panel = null; if (l.learn.i >= n - 1) { l.stage = l.stage === "relearnLearn" ? "relearnMem" : "memorize"; UI.flip = false; } else l.learn.i++; save(); render(); window.scrollTo({top: 0}); break; }
    case "learnPrev": { const l = L(d); l.learn.i = Math.max(0, l.learn.i - 1); UI.panel = null; save(); render(); break; }
    case "reviewAgain": { const l = L(d); const mods = modulesFor(l); const t = F(mods[l.learn.i].id).t; const first = mods.findIndex(m => (m.type === "topic" && m.t === t) || (m.type === "fact" && F(m.id).t === t)); l.learn.i = Math.max(0, first); UI.panel = null; save(); render(); break; }
    case "panel": UI.panel = UI.panel === ds.k ? null : ds.k; render(); break;
    case "tutor": await askTutor(ds.id); break;
    case "flip": UI.flip = true; render(); break;
    case "memGrade": { const l = L(d), M = l.mem, id = M.queue.shift(), ok = ds.ok === "1";
      E.record(S, {fid: id, ans: 0}, ok ? 0 : 1, ok ? "knew" : "guess", "m", 0.5);
      if (!ok) { M.misses[id] = (M.misses[id] || 0) + 1; M.queue.splice(Math.min(2, M.queue.length), 0, id); } else celebrate(false);
      UI.flip = false; save(); render(); break; }
    case "memSkip": { const l = L(d); l.stage = "quiz"; save(); render(); break; }
    case "mL": UI.sel = ds.id; render(); break;
    case "mR": { if (!UI.sel) { toast("Tap a prompt on the left first"); break; } if (ds.id === UI.sel) { UI.matchDone.push(ds.id); UI.sel = null; const l = L(d); if (UI.matchDone.length >= matchPairs(l.mem.groups[l.mem.gi]).length) { celebrate(false); nextMemGroup(d, l); } } else { UI.shake = ds.id; setTimeout(() => { UI.shake = null; }, 400); } render(); break; }
    case "ladder": { const l = L(d), M = l.mem; const g2 = l.plan.canonGroups[M.ladderIdx]; const books = [...CANON.OT, ...CANON.NT].find(x => x[0] === g2)[1];
      const chunk = books.length > 7 ? (UI.ladderPart ? books.slice(Math.ceil(books.length / 2)) : books.slice(0, Math.ceil(books.length / 2))) : books;
      if (ds.b === chunk[UI.ladder.length]) { UI.ladder.push(ds.b); if (UI.ladder.length === chunk.length) { celebrate(false); UI.ladder = []; if (books.length > 7 && !UI.ladderPart) UI.ladderPart = 1; else { UI.ladderPart = 0; M.ladderIdx++; } save(); } }
      else { UI.shake = ds.b; setTimeout(() => { UI.shake = null; }, 400); E.record(S, {fid: "c:" + chunk[UI.ladder.length], ans: 0}, 1, "guess", "m", 0.5); }
      render(); break; }
    case "relearn": { const l = L(d); const an = E.analyzeAttempt(l.quiz); l.relearn = [...new Set(an.rows.filter(x => !x.ok || x.conf !== "knew").map(x => x.q.fid).filter(id => !id.startsWith("c:")))]; l.learn.i = 0; buildMem(l, l.relearn, []); l.stage = "relearnLearn"; save(); render(); window.scrollTo({top: 0}); break; }
    case "finishLesson": { const l = L(d); l.stage = "done"; l.doneAt = Date.now(); delete l.relearn; save(); celebrate(true); UI.day = d; render(); break; }
    case "startFinal": S.final = newAttempt("final", E.finalExam(S, Date.now() % 1e9)); save(); render(); break;
    case "fireworks": fireworks(); break;
    case "startRev": startRev(ds.k); break;

    case "revDone": S.rev.done = true; save(); render(); break;
    case "signin": case "signup": await doAuth(a); break;
    case "authSwitch": UI.signup = !UI.signup; UI.authMsg = ""; render(); break;
    case "signout": await flush(); await SB.auth.signOut(); USER = null; S = blank(); UI.signup = false; UI.authMsg = ""; UI.view = "dash"; render(); break;
    case "reset": if (confirm("Erase your diagnostic, lessons, and progress? The imported cards stay.")) { const im = S.imported; S = blank(); S.imported = im; save(); go("dash"); } break;
  }
  if (a === "submit" && ds.p === "final") { const l = L(5); l.stage = "done"; l.doneAt = Date.now(); save(); UI.view = "finalResults"; render(); }
});
function relearnQuiz(l){ const r = E.rng(Date.now() % 1e9); const avoid = new Set(l.quiz.qs.map(q => q.qid)); return E.shuffle((l.relearn || []).map(id => { const f = F(id); const fm = E.formsFor(f).filter(x => !avoid.has(id + ":" + x)); return E.buildQ(f, fm[0] || "f", r); }), r); }
function focusQ(i, next){ const el = document.querySelector(`[data-qi="${i}"]`); if (el) { el.focus({preventScroll: !next}); if (next) el.scrollIntoView({block: "nearest", behavior: "smooth"}); } }
document.addEventListener("keydown", e => {
  const art = e.target.closest && e.target.closest("[data-qi]"); if (!art || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase(); const map = {a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3};
  const btns = art.querySelectorAll(".opt"); const cf = {k: "knew", e: "elim", g: "guess"};
  if (k in map && btns[map[k]]) { btns[map[k]].click(); e.preventDefault(); }
  else if (k in cf) { const c = art.querySelector(`.conf [data-k="${cf[k]}"]`); if (c) { c.click(); e.preventDefault(); } }
});


// AI tutor (optional): grounded in the card, labeled as supplemental
async function askTutor(id){
  const f = F(id), raw = RAW[f.e - 1];
  try {

    S.tutor[id] = (res.text || "").trim(); save(); render();
  } catch (e) { toast(e && e.code === "not_granted" ? "Tutor access was declined" : "The tutor couldn't answer right now"); }
